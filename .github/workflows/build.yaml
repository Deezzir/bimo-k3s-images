name: Build And Push Images

on:
  push:
    branches:
      - main
    paths:
      - images/**
      - images.yaml
      - scripts/images.py
      - .github/workflows/build.yaml
  workflow_dispatch:
    inputs:
      image:
        description: Image name to build, or all
        required: false
        default: all
        type: string

permissions:
  contents: read
  packages: write

jobs:
  discover:
    name: Select images to publish
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_images: ${{ steps.matrix.outputs.has_images }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate image catalog
        run: python3 scripts/images.py validate

      - name: Select images
        id: matrix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            matrix="$(python3 scripts/images.py matrix '${{ inputs.image }}')"
          else
            matrix="$(python3 scripts/images.py changed '${{ github.event.before }}' '${{ github.sha }}')"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == '{"include":[]}' ]]; then
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_images=true" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: Build and publish ${{ matrix.image }}
    needs: discover
    if: needs.discover.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/deezzir/${{ matrix.image }}:latest
            ghcr.io/deezzir/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
